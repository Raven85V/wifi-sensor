; ============================================================
;  Wi-Fi датчик для PixelHub 75
;  Две сборки:
;    env:esp32    — ESP32 (SDA 21, SCL 22, DS18B20 4)
;    env:esp8266  — ESP8266 NodeMCU/Wemos (SDA D2=4, SCL D1=5, DS18B20 D5=14)
; ============================================================

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<main.cpp> -<esp8266_main.cpp>
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire
    milesburton/DallasTemperature

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<esp8266_main.cpp> -<main.cpp>
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire
    milesburton/DallasTemperature
